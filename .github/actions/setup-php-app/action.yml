name: "Setup PHP Application"
description: "Sets up a PHP application with the required version, enabling necessary extensions, and installing Composer dependencies while making use of the cache"

inputs:
  php-version:
    description: "The required PHP version for this service (e.g., 8.3)"
    required: true
  working-directory:
    description: "The path to the service directory (e.g., projects/cms-service)"
    required: true
  php-extensions:
    description: "List of required PHP extensions, separated by commas"
    required: false
    # The test suites run against sqlite :memory: (see each service's phpunit.xml),
    # so pdo_sqlite/sqlite3 are required. pdo_mysql and redis stay available for
    # code that only type-hints or configures them.
    default: "mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3, pdo_mysql, redis, bcmath, zip"
  composer-args:
    description: "Additional options to pass to the composer install command"
    required: false
    default: "--no-interaction --prefer-dist --no-progress"

outputs:
  cache-hit:
    description: "Whether the Composer dependencies were found in the cache or not"
    value: ${{ steps.composer-cache.outputs.cache-hit }}

runs:
  using: "composite"
  steps:
    - name: Setup PHP ${{ inputs.php-version }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        extensions: ${{ inputs.php-extensions }}
        coverage: none
        tools: composer:v2

    - name: Get Composer cache directory
      id: composer-cache-dir
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

    - name: Cache Composer dependencies
      id: composer-cache
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache-dir.outputs.dir }}
        key: composer-${{ runner.os }}-${{ inputs.working-directory }}-${{ hashFiles(format('{0}/composer.lock', inputs.working-directory)) }}
        restore-keys: |
          composer-${{ runner.os }}-${{ inputs.working-directory }}-

    - name: Validate composer.json and composer.lock
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # Deliberately not --strict: the gate for a push is the test suite, and we do not
      # want cosmetic composer.json warnings to block it.
      run: composer validate --no-check-publish --no-check-all

    - name: Install Composer dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: composer install ${{ inputs.composer-args }}

    - name: Verify vendor directory exists
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ ! -d "vendor" ]; then
          echo "::error::vendor directory not found after composer install. Stopping the pipeline."
          exit 1
        fi
